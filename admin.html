<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BossOrNot Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #111;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .msg {
      margin-top: 12px;
      font-size: 14px;
    }

    .payment {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
    }

    .status.approved {
      background: #d1e7dd;
      color: #0f5132;
    }

    .status.rejected {
      background: #f8d7da;
      color: #842029;
    }

    .row {
      margin: 8px 0;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    .logout {
      background: #777;
      float: right;
    }

    .slip {
      width: 100%;
      max-width: 450px;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      display: block;
    }

    .slip-button {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: #111;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .approve-btn {
      background: #198754;
    }

    .reject-btn {
      background: #dc3545;
    }

    .error {
      color: #c00;
      font-size: 13px;
      margin-top: 8px;
      word-break: break-word;
    }

    .success {
      color: #198754;
      font-size: 14px;
      margin-top: 8px;
    }

    .certificate {
      background: #f0fff5;
      border: 1px solid #b7dfc8;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      word-break: break-word;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginCard" class="card">

    <h1>Admin Login</h1>

    <input
      id="password"
      type="password"
      placeholder="Admin Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div
      id="loginMsg"
      class="msg"
    ></div>

  </div>



  <!-- ========================= -->
  <!-- DASHBOARD -->
  <!-- ========================= -->

  <div
    id="dashboard"
    class="hidden"
  >


    <div class="card">

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

      <h1>BossOrNot Admin</h1>

      <p>
        Payment Requests
      </p>

      <button
        onclick="loadPayments()"
      >
        Refresh
      </button>

    </div>



    <div class="card">

      <div id="payments">
        Loading...
      </div>

    </div>


  </div>


</div>



<script>


// =====================================
// ADMIN TOKEN
// =====================================

let adminToken =
  localStorage.getItem(
    "boss_admin_token"
  );



// =====================================
// SHOW DASHBOARD
// =====================================

function showDashboard() {

  document
    .getElementById("loginCard")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  loadPayments();

}



// =====================================
// LOGOUT
// =====================================

function logout() {

  localStorage.removeItem(
    "boss_admin_token"
  );

  adminToken = null;

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginCard")
    .classList.remove("hidden");

}



// =====================================
// LOGIN
// =====================================

async function login() {

  const password =
    document
      .getElementById("password")
      .value
      .trim();

  const msg =
    document
      .getElementById("loginMsg");


  if (!password) {

    msg.textContent =
      "Password ထည့်ပါ";

    return;
  }


  msg.textContent =
    "Logging in...";


  try {

    const response =
      await fetch(
        "/api/admin",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            password: password
          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      msg.textContent =
        data.message ||
        "Login failed";

      return;
    }


    adminToken =
      data.token;


    localStorage.setItem(
      "boss_admin_token",
      adminToken
    );


    document
      .getElementById("password")
      .value = "";


    msg.textContent = "";


    showDashboard();


  } catch (error) {

    msg.textContent =
      "Connection error: " +
      error.message;

  }

}



// =====================================
// LOAD PAYMENTS
// =====================================

async function loadPayments() {

  const box =
    document.getElementById(
      "payments"
    );


  box.innerHTML =
    "Loading...";


  try {

    const response =
      await fetch(
        "/api/admin",
        {
          headers: {
            "Authorization":
              "Bearer " +
              adminToken
          }
        }
      );


    const data =
      await response.json();


    // -------------------------------
    // TOKEN EXPIRED
    // -------------------------------

    if (
      response.status === 401
    ) {

      logout();

      return;
    }


    // -------------------------------
    // API ERROR
    // -------------------------------

    if (
      !response.ok ||
      !data.ok
    ) {

      box.innerHTML =
        "<b>❌ Error</b><br>" +
        escapeHtml(
          data.message ||
          "Failed"
        ) +
        "<br><br><small>" +
        escapeHtml(
          data.details ||
          "No details"
        ) +
        "</small>";

      return;
    }


    // -------------------------------
    // NO PAYMENTS
    // -------------------------------

    if (
      !data.payments ||
      !data.payments.length
    ) {

      box.innerHTML =
        "<p>No payment requests.</p>";

      return;
    }


    // -------------------------------
    // PAYMENT CARDS
    // -------------------------------

    box.innerHTML =
      data.payments
        .map(payment => {

          return createPaymentCard(
            payment
          );

        })
        .join("");


  } catch (error) {

    box.innerHTML =
      "<b>❌ Error</b><br>" +
      escapeHtml(
        error.message ||
        "Connection error"
      );

  }

}



// =====================================
// CREATE PAYMENT CARD
// =====================================

function createPaymentCard(payment) {

  const status =
    String(
      payment.status || ""
    );


  // -----------------------------------
  // STATUS CLASS
  // -----------------------------------

  let statusClass = "";

  if (status === "approved") {
    statusClass = "approved";
  }

  if (status === "rejected") {
    statusClass = "rejected";
  }



  // -----------------------------------
  // SLIP HTML
  // -----------------------------------

  let slipHtml = "";


  if (payment.slip_url) {

    slipHtml = `

      <div class="row">

        <span class="label">
          Payment Slip:
        </span>

        <br>

        <img
          class="slip"
          src="${escapeHtml(
            payment.slip_url
          )}"
          alt="Payment Slip"
          loading="lazy"
        >

        <a
          class="slip-button"
          href="${escapeHtml(
            payment.slip_url
          )}"
          target="_blank"
          rel="noopener"
        >
          🔍 View Slip Full Size
        </a>

      </div>

    `;

  } else {

    slipHtml = `

      <div class="row">

        <span class="label">
          Payment Slip:
        </span>

        <div class="error">
          Slip URL မရပါ
        </div>

        ${
          payment.slip_error
            ? `
              <div class="error">
                ${escapeHtml(
                  payment.slip_error
                )}
              </div>
            `
            : ""
        }

      </div>

    `;

  }



  // -----------------------------------
  // CERTIFICATE
  // -----------------------------------

  let certificateHtml = "";


  if (
    payment.certificate_id
  ) {

    certificateHtml = `

      <div class="certificate">

        <b>
          Certificate ID:
        </b>

        ${escapeHtml(
          payment.certificate_id
        )}

      </div>

    `;

  }



  // -----------------------------------
  // ACTION BUTTONS
  // -----------------------------------

  let actionHtml = "";


  if (
    status === "pending"
  ) {

    const orderId =
      escapeHtml(
        payment.order_id
      );


    actionHtml = `

      <div class="actions">

        <button
          class="approve-btn"
          onclick="approvePayment('${orderId}')"
        >
          ✅ Approve
        </button>

        <button
          class="reject-btn"
          onclick="rejectPayment('${orderId}')"
        >
          ❌ Reject
        </button>

      </div>

    `;

  }



  // -----------------------------------
  // RETURN CARD
  // -----------------------------------

  return `

    <div class="payment">

      <div class="row">

        <span class="label">
          Order ID:
        </span>

        ${escapeHtml(
          payment.order_id
        )}

      </div>


      <div class="row">

        <span class="label">
          Name:
        </span>

        ${escapeHtml(
          payment.name
        )}

      </div>


      <div class="row">

        <span class="label">
          Email:
        </span>

        ${escapeHtml(
          payment.email
        )}

      </div>


      <div class="row">

        <span class="label">
          Amount:
        </span>

        ${escapeHtml(
          payment.amount
        )}
        MMK

      </div>


      <div class="row">

        <span class="label">
          Method:
        </span>

        ${escapeHtml(
          payment.method
        )}

      </div>


      <div class="row">

        <span class="label">
          Status:
        </span>

        <span
          class="status ${statusClass}"
        >
          ${escapeHtml(
            payment.status
          )}
        </span>

      </div>


      <div class="row">

        <span class="label">
          Created:
        </span>

        ${escapeHtml(
          payment.created_at
        )}

      </div>


      ${slipHtml}


      ${certificateHtml}


      ${actionHtml}


    </div>

  `;

}



// =====================================
// APPROVE PAYMENT
// =====================================

async function approvePayment(
  orderId
) {

  const confirmed =
    confirm(
      "ဒီ Payment ကို Approve လုပ်မှာ သေချာပါသလား?"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/approve",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              adminToken
          },

          body: JSON.stringify({
            order_id: orderId,
            action: "approve"
          })
        }
      );


    const data =
      await response.json();


    // -------------------------------
    // SESSION EXPIRED
    // -------------------------------

    if (
      response.status === 401
    ) {

      logout();

      return;
    }


    // -------------------------------
    // ERROR
    // -------------------------------

    if (
      !response.ok ||
      !data.ok
    ) {

      alert(
        "❌ Approve မအောင်မြင်ပါ\n\n" +
        (
          data.message ||
          "Unknown error"
        ) +
        "\n" +
        (
          data.details ||
          ""
        )
      );

      return;
    }


    // -------------------------------
    // SUCCESS
    // -------------------------------

    alert(
      "✅ Payment Approved!\n\n" +
      "Certificate ID: " +
      data.certificate_id
    );


    // Reload payment list

    loadPayments();


  } catch (error) {

    alert(
      "❌ Connection Error\n\n" +
      error.message
    );

  }

}



// =====================================
// REJECT PAYMENT
// =====================================

async function rejectPayment(
  orderId
) {

  const confirmed =
    confirm(
      "ဒီ Payment ကို Reject လုပ်မှာ သေချာပါသလား?"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/approve",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              adminToken
          },

          body: JSON.stringify({
            order_id: orderId,
            action: "reject"
          })
        }
      );


    const data =
      await response.json();


    // -------------------------------
    // SESSION EXPIRED
    // -------------------------------

    if (
      response.status === 401
    ) {

      logout();

      return;
    }


    // -------------------------------
    // ERROR
    // -------------------------------

    if (
      !response.ok ||
      !data.ok
    ) {

      alert(
        "❌ Reject မအောင်မြင်ပါ\n\n" +
        (
          data.message ||
          "Unknown error"
        ) +
        "\n" +
        (
          data.details ||
          ""
        )
      );

      return;
    }


    // -------------------------------
    // SUCCESS
    // -------------------------------

    alert(
      "❌ Payment Rejected"
    );


    // Reload payment list

    loadPayments();


  } catch (error) {

    alert(
      "❌ Connection Error\n\n" +
      error.message
    );

  }

}



// =====================================
// ESCAPE HTML
// =====================================

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



// =====================================
// AUTO LOGIN
// =====================================

if (adminToken) {

  showDashboard();

}


</script>


</body>
</html>
